# 2-epoch smoke config — same as train_joint_popsign.yaml except num_epoch,
# warm_up_epoch and step, so a full-chain sanity run finishes in minutes.
# Its Experiment_name differs so smoke checkpoints never collide with (or get
# resumed into) the real run's save_models/ entries.
Experiment_name: popsign_joint_smoke

feeder: feeders.feeder.Feeder
train_feeder_args:
  data_path: ${ASL2LSC_SLGCN_POPSIGN_DATA}/gendata_27/train_data_joint.npy
  label_path: ${ASL2LSC_SLGCN_POPSIGN_DATA}/gendata_27/train_label.pkl
  debug: True          # upstream Feeder: keep only the first 100 samples
  random_choose: True
  window_size: 120
  random_shift: True
  normalization: True
  random_mirror: True
  random_mirror_p: 0.5
  is_vector: False

test_feeder_args:
  data_path: ${ASL2LSC_SLGCN_POPSIGN_DATA}/gendata_27/val_data_joint.npy
  label_path: ${ASL2LSC_SLGCN_POPSIGN_DATA}/gendata_27/val_label.pkl
  random_mirror: False
  normalization: True
  debug: True

model: model.decouple_gcn_attn.Model
model_args:
  num_class: 250
  num_point: 27
  num_person: 1
  graph: graph.sign_27.Graph
  groups: 16
  block_size: 41
  graph_args:
    labeling_mode: 'spatial'

weight_decay: 0.0001
base_lr: 0.1
step: [1]

device: [0]
keep_rate: 0.9
only_train_epoch: 1
batch_size: 64
test_batch_size: 64
num_epoch: 2
nesterov: True
warm_up_epoch: 1
num_worker: 8
show_topk: [1, 3, 5]
