# Smoke variant of train_joint_semlex.yaml: upstream's own debug flag
# (first 100 samples), 2 epochs, tiny batch. Everything else identical.
Experiment_name: semlex_joint_smoke

feeder: feeders.feeder.Feeder
train_feeder_args:
  data_path: ${ASL2LSC_SLGCN_SEMLEX_DATA}/gendata_27/train_data_joint.npy
  label_path: ${ASL2LSC_SLGCN_SEMLEX_DATA}/gendata_27/train_label.pkl
  debug: True
  random_choose: True
  window_size: 120
  random_shift: True
  normalization: True
  random_mirror: True
  random_mirror_p: 0.5
  is_vector: False

test_feeder_args:
  data_path: ${ASL2LSC_SLGCN_SEMLEX_DATA}/gendata_27/val_data_joint.npy
  label_path: ${ASL2LSC_SLGCN_SEMLEX_DATA}/gendata_27/val_label.pkl
  random_mirror: False
  normalization: True
  debug: True

model: model.decouple_gcn_attn.Model
model_args:
  num_class: 1914
  num_point: 27
  num_person: 1
  graph: graph.sign_27.Graph
  groups: 16
  block_size: 41
  graph_args:
    labeling_mode: 'spatial'

weight_decay: 0.0001
base_lr: 0.1
step: [150, 200]

device: [0]
keep_rate: 0.9
only_train_epoch: 1
batch_size: 8
test_batch_size: 8
num_epoch: 2
nesterov: True
warm_up_epoch: 20
num_worker: 4
show_topk: [1, 3, 5]
