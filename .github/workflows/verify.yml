name: certify-release-tree
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fresh-clone smoke test (env gating + syntax)
        run: python3 tools/smoke_test.py .
